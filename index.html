<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DEEPSEA — Abyssal Descent</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+KR:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root { --hud: #7fe8ff; --hud-dim: rgba(127, 232, 255, .55); --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: #dff; font-family: 'Rajdhani', 'Noto Sans KR', sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: auto; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .zone { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 1.6s; letter-spacing: .35em; text-shadow: 0 0 12px rgba(80, 220, 255, .6); }
  .zone b { display: block; font-size: 30px; font-weight: 600; color: var(--hud); }
  .zone span { font-size: 14px; color: var(--hud-dim); font-family: 'Noto Sans KR'; letter-spacing: .2em; }
  .zone.show { opacity: 1; }
  .entry-hint { position: absolute; left: 50%; bottom: 2.6%; transform: translateX(-50%); font-size: 12px; color: var(--hud-dim); letter-spacing: .18em; opacity: 0; transition: opacity .8s; font-family: 'Noto Sans KR'; white-space: nowrap; }
  .tip { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); font-size: 15px; color: var(--hud-dim); letter-spacing: .12em; text-align: center; transition: opacity 1s; font-family: 'Noto Sans KR'; white-space: nowrap; }
  .corner { position: absolute; font-size: 12px; color: var(--hud-dim); letter-spacing: .15em; }
  #perf { right: 18px; top: 14px; text-align: right; font-family: ui-monospace, monospace; font-size: 11px; opacity: .55; }
  #look { left: 18px; top: 14px; font: 600 11px 'Rajdhani'; letter-spacing: .2em; padding: 3px 8px; border: 1px solid var(--hud-dim); border-radius: 3px; }
  #cine { left: 18px; top: 40px; font: 600 11px 'Rajdhani'; letter-spacing: .25em; color: #ff8a7a; }
  #look.on { color: #0b1a20; background: var(--hud); }
  #keys { left: 18px; bottom: 14px; line-height: 1.7; font-family: 'Noto Sans KR'; font-size: 12px; }
  #keys kbd { display: inline-block; min-width: 16px; padding: 0 5px; margin-right: 6px; border: 1px solid var(--hud-dim); border-radius: 3px; font: 600 11px 'Rajdhani'; text-align: center; color: var(--hud); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(0, 30, 50, .55), rgba(0, 0, 0, .9)); cursor: pointer; transition: opacity .8s; }
  #start h1 { margin: 0; font-size: clamp(38px, 7vw, 86px); font-weight: 700; letter-spacing: .4em; color: #bff4ff; text-shadow: 0 0 30px rgba(60, 200, 255, .5); padding-left: .4em; }
  #start p { margin: 10px 0 0; font-family: 'Noto Sans KR'; font-weight: 300; letter-spacing: .3em; color: #8ccfe0; }
  #start .go { margin-top: 44px; padding: 12px 34px; border: 1px solid rgba(127, 232, 255, .5); letter-spacing: .3em; color: var(--hud); font-size: 16px; }
  #start .go.wait { opacity: .45; }
  #start .go2 { margin-top: 14px; padding: 9px 26px; border: 1px solid rgba(127, 232, 255, .3); letter-spacing: .25em; color: #8ccfe0; font-size: 13px; font-family: 'Noto Sans KR'; }
  #start .go2:hover, #start .go:hover { border-color: rgba(127, 232, 255, .9); color: #bff4ff; }
  #start .go2.wait { display: none; }
  #start small { padding: 0 16px; text-align: center; margin-top: 18px; color: #6aa; font-family: 'Noto Sans KR'; font-size: 12px; letter-spacing: .1em; }
  .lb { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height 1.6s ease; pointer-events: none; }
  .lb.t { top: 0; } .lb.b { bottom: 0; }
  body.cine .lb { height: calc((100vh - 100vw / 2.35) / 2); }
  @media (orientation: portrait) {   /* phones held upright: no 2.35 letterbox, zone title fits the width */
    body.cine .lb { height: 0; }
    .zone { width: 92vw; } .zone b { font-size: 21px; letter-spacing: .2em; } .zone span { font-size: 12px; letter-spacing: .08em; }
  }
  body.cine #keys, body.cine #perf { opacity: 0; transition: opacity 1s; }
  #err { position: fixed; left: 16px; top: 16px; right: 16px; color: #f88; font: 13px monospace; white-space: pre-wrap; display: none; background: rgba(0, 0, 0, .8); padding: 12px; }
  #dbg { position: fixed; top: 48px; right: 18px; width: 380px; max-height: 80vh; overflow: auto; background: rgba(0, 10, 18, .82); border: 1px solid rgba(127, 232, 255, .35);
    color: #bfefff; font: 12px/1.45 'Noto Sans KR', monospace; padding: 10px 12px; z-index: 50; pointer-events: auto; }
  #dbg h4 { margin: 4px 0 6px; font-size: 12px; letter-spacing: .15em; color: #7fe8ff; }
  #dbg .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px solid rgba(127, 232, 255, .08); }
  #dbg .row.off { opacity: .35; }
  #dbg .row.live { background: rgba(80, 255, 170, .08); } #dbg .row.live button { color: #7fffc0; border-color: rgba(127, 255, 190, .6); opacity: 1; }
  #dbg .row.pend { background: rgba(255, 210, 90, .08); } #dbg .row.pend button { color: #ffd98a; border-color: rgba(255, 210, 110, .7); background: rgba(255, 210, 90, .15); }
  #dbg .zdiv { margin: 10px 0 3px; padding-top: 4px; border-top: 1px solid rgba(127, 232, 255, .4); font-size: 11px; letter-spacing: .1em; color: #7fe8ff; opacity: .75; }
  #dbg .zdiv.here { opacity: 1; color: #bff6ff; }
  #dbg button { background: rgba(127, 232, 255, .12); color: #dff8ff; border: 1px solid rgba(127, 232, 255, .45); font: 11px 'Noto Sans KR'; padding: 1px 8px; cursor: pointer; }
  #dbg button:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="zone" id="zone"><b></b><span></span></div>
  <div class="tip" id="tip"></div>
  <div class="entry-hint" id="entryHint" data-t="SPACE 를 눌러 바다로 뛰어들기|Press SPACE to dive in"></div>
  <div class="corner" id="perf"></div>
  <div class="corner" id="keys"></div>
  <div class="corner" id="look"></div>
  <div class="corner" id="cine" style="display:none">● CINEMATIC</div>
<div id="dbg" style="display:none"></div>
</div>
<div id="start">
  <h1>DEEPSEA</h1>
  <p data-t="심해 4,000 m 하강|Descend 4,000 m into the deep"></p>
  <div class="go wait" id="go">LOADING…</div>
  <div class="go2 wait" id="goFloor" data-t="바닥에서 시작 · 4,000 m|Start on the floor · 4,000 m"></div>
  <div class="go2 wait" id="goCine" data-t="시네마틱 시작 · 자동 하강|Start cinematic · auto descent"></div>
  <small id="startNote" data-t="헤드폰 권장 · 마우스로 시점 · 클릭하면 시작 · L 한국어/English|Headphones recommended · mouse to look · click to start · L English/한국어"></small>
</div>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
